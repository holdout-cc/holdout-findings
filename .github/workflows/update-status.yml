name: Update issue status

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh findings.json and the READMEs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_status.py
      - name: Decide whether to commit
        id: decide
        shell: python
        run: |
          # Everything the script writes is derived from findings.json plus today's date,
          # so compare findings.json with the committed copy, ignoring generated_at, and
          # check the READMEs for corrections other than dates.
          # Commit on any real change, or when the committed date is a week old or more.
          import datetime, json, os, re, subprocess

          def text_changed():
              # A README or finding status line the script corrected without any change to
              # findings.json (for example after a hand edit) still needs committing.
              # Dates alone don't count; they follow the weekly rule below.
              diff = subprocess.run(["git", "diff", "-U0", "--", "README.md", "findings"],
                                    capture_output=True, text=True).stdout
              strip = lambda line: re.sub(r"\d{4}-\d{2}-\d{2}", "", line[1:])
              minus = sorted(strip(l) for l in diff.splitlines() if l.startswith("-") and not l.startswith("---"))
              plus = sorted(strip(l) for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++"))
              return minus != plus

          def load(text):
              data = json.loads(text)
              return data, data.pop("generated_at", "")[:10]

          new, new_date = load(open("findings.json", encoding="utf-8").read())
          shown = subprocess.run(["git", "show", "HEAD:findings.json"], capture_output=True, text=True)
          if shown.returncode:
              action = "changed"
          else:
              old, old_date = load(shown.stdout)
              if old != new or text_changed():
                  action = "changed"
              elif not old_date or (datetime.date.fromisoformat(new_date)
                                    - datetime.date.fromisoformat(old_date)).days >= 7:
                  action = "weekly"
              else:
                  action = "none"
          print(f"commit: {action}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"action={action}\n")
      - name: Commit
        if: steps.decide.outputs.action != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findings.json README.md findings
          if [ "${{ steps.decide.outputs.action }}" = "changed" ]; then
            git commit -m "Update issue status"
          else
            git commit -m "Refresh status date"
          fi
          git push
