name: Update issue status

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_status.py
      - name: Commit if a status changed
        run: |
          # The script always rewrites the "Status as of" date; only commit real status changes.
          if git diff -U0 | grep -E '^[-+][^-+]' | grep -qv 'Status as of'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update issue status"
            git push
          else
            git checkout -- .
          fi
